
<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Một cuốn sách nhỏ dành cho bạn</title>

<style>
* {
    box-sizing: border-box;
}

:root {
    --pink: #c87591;
    --dark-pink: #a65070;
    --paper: #fffaf3;
    --text: #704858;
}

body {
    margin: 0;
    min-height: 100vh;
    background: linear-gradient(135deg, #f8dce8, #fff1df, #f4dce5);
    font-family: Georgia, serif;
    color: var(--text);
    overflow: hidden;
}

/* KHUNG 9:16 */
.screen {
    width: min(100vw, 56.25svh);
    height: min(100svh, 177.7778vw);
    aspect-ratio: 9 / 16;
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    overflow: hidden;
    background: #fff3ed;
    box-shadow: 0 0 35px #8c526044;
}

.scene {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 5%;
    overflow: hidden;
    background:
        radial-gradient(circle at 10% 10%, #fce5ec, transparent 35%),
        radial-gradient(circle at 90% 90%, #f7e3d9, transparent 35%),
        #fff8f1;
}

/* TRANG TRÍ */
.decor {
    position: absolute;
    color: #d58da6;
    opacity: .55;
    pointer-events: none;
    animation: float 5s ease-in-out infinite;
}

.d1 { top: 7%; left: 8%; font-size: 25px; }
.d2 { top: 13%; right: 9%; font-size: 20px; animation-delay: 1s; }
.d3 { bottom: 10%; left: 10%; font-size: 25px; animation-delay: 2s; }
.d4 { bottom: 13%; right: 10%; font-size: 20px; animation-delay: 1.5s; }

@keyframes float {
    0%,100% { transform: translateY(0) rotate(0); }
    50% { transform: translateY(-12px) rotate(10deg); }
}

/* BÌA */
.cover {
    width: 100%;
    height: 100%;
    padding: 9%;
    border: 5px double #d99bb0;
    border-radius: 8px 22px 22px 8px;
    background: linear-gradient(145deg, #fffaf3, #f8dce8);
    box-shadow: inset 10px 0 15px #d69bad55,
                8px 12px 25px #9c647744;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
    position: relative;
}

.cover::before {
    content: "";
    position: absolute;
    left: 6%;
    top: 0;
    bottom: 0;
    width: 3px;
    background: #e3b5c4;
}

.cover-flower {
    font-size: clamp(42px, 10vw, 65px);
    margin-bottom: 7%;
}

.cover h1 {
    font-size: clamp(24px, 6vw, 34px);
    color: var(--dark-pink);
    line-height: 1.5;
    margin: 0 0 5%;
}

.cover p {
    font-size: clamp(13px, 3.5vw, 16px);
    line-height: 1.9;
}

.main-button {
    margin-top: 9%;
    padding: 13px 25px;
    border: none;
    border-radius: 30px;
    color: white;
    background: var(--pink);
    font-family: inherit;
    font-size: 16px;
    box-shadow: 0 5px 12px #a44f7244;
    cursor: pointer;
}

/* KHU VỰC SÁCH */
#bookScreen {
    display: none;
}

.book {
    width: 100%;
    height: 100%;
    position: relative;
    perspective: 1600px;
}

.paper {
    position: absolute;
    inset: 3%;
    padding: 8% 7%;
    border: 1px solid #e8c9c0;
    border-radius: 5px 15px 15px 5px;
    background:
        linear-gradient(90deg, #f1e1d6 0%, transparent 5%),
        var(--paper);
    box-shadow: 7px 8px 22px #956a5944,
                inset 12px 0 15px #e8d4cb44;
    transform-origin: left center;
    overflow: hidden;
}

.paper::before {
    content: "";
    position: absolute;
    top: 0;
    bottom: 0;
    left: 5%;
    width: 2px;
    background: #efddd3;
}

.paper.flip-next {
    animation: flipNext .65s ease-in-out forwards;
}

.paper.flip-prev {
    animation: flipPrev .65s ease-in-out forwards;
}

@keyframes flipNext {
    0% { transform: rotateY(0); opacity: 1; }
    45% { transform: rotateY(-85deg); opacity: .65; }
    100% { transform: rotateY(-180deg); opacity: 0; }
}

@keyframes flipPrev {
    0% { transform: rotateY(0); opacity: 1; }
    45% { transform: rotateY(85deg); opacity: .65; }
    100% { transform: rotateY(180deg); opacity: 0; }
}

/* NỘI DUNG TỪNG TRANG */
.page {
    position: relative;
    z-index: 1;
    width: 100%;
    height: 100%;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
}

.page h2 {
    color: var(--dark-pink);
    font-size: clamp(21px, 5.5vw, 29px);
    line-height: 1.4;
    margin: 0 0 6%;
}

.page p {
    font-size: clamp(13px, 3.6vw, 17px);
    line-height: 1.9;
    margin: 3% 0;
}

.page-content {
    width: 100%;
    max-height: 100%;
}

.page-number {
    position: absolute;
    bottom: 1%;
    font-size: 12px;
    color: #b88d99;
}

.type-text {
    white-space: pre-line;
    overflow-wrap: anywhere;
}

/* TRANG 1 */
.welcome-box {
    background: #fff0f3;
    border: 1px dashed #d69bad;
    border-radius: 18px;
    padding: 8%;
    width: 100%;
}

.big-flower {
    font-size: 45px;
    margin-bottom: 5%;
}

/* TRANG 2 - THẺ DỌC */
.cards {
    display: flex;
    gap: 3%;
    width: 100%;
    align-items: stretch;
    margin-top: 7%;
}

.card {
    flex: 1;
    min-width: 0;
    height: 48%;
    min-height: 0;
    padding: 5% 3%;
    border: 1px solid #e7b7c6;
    border-radius: 14px;
    background: linear-gradient(160deg, #fff0f4, #f9e5df);
    box-shadow: 0 5px 12px #b77b8b22;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    animation: cardIn .8s both;
}

.card:nth-child(2) { animation-delay: .25s; }
.card:nth-child(3) { animation-delay: .5s; }

@keyframes cardIn {
    from { opacity: 0; transform: translateY(25px); }
    to { opacity: 1; transform: translateY(0); }
}

.card .emoji {
    font-size: clamp(23px, 6vw, 34px);
    margin-bottom: 8%;
}

.card h3 {
    font-size: clamp(11px, 3vw, 15px);
    line-height: 1.5;
    color: #a44f72;
    margin: 0 0 7%;
}

.card p {
    font-size: clamp(10px, 2.6vw, 13px);
    line-height: 1.7;
    margin: 0;
}

/* TRANG 3 */
.thought-box {
    background: #fff0e8;
    border-left: 4px solid #d69bad;
    border-radius: 12px;
    padding: 7%;
    text-align: left;
}

/* TRANG 4 - PHONG BÌ */
.envelope-area {
    display: flex;
    flex-direction: column;
    align-items: center;
    margin-top: 8%;
}

.envelope {
    width: 65%;
    max-width: 230px;
    height: 120px;
    position: relative;
    background: #e9a9ba;
    border-radius: 5px;
    box-shadow: 0 8px 18px #a44f7244;
    margin-top: 35px;
}

.envelope::before {
    content: "";
    position: absolute;
    top: 0;
    left: 0;
    width: 0;
    height: 0;
    border-left: 50% solid transparent;
    border-right: 50% solid transparent;
    border-top: 65px solid #d986a0;
    z-index: 3;
    transform-origin: top;
    transition: transform .9s;
}

.envelope::after {
    content: "♡";
    position: absolute;
    top: 42px;
    left: 45%;
    font-size: 28px;
    color: white;
    z-index: 4;
}

.letter {
    position: absolute;
    width: 85%;
    height: 95px;
    left: 7.5%;
    top: 10px;
    background: #fffdf8;
    padding: 12px;
    font-size: 13px;
    line-height: 1.6;
    z-index: 2;
    transition: transform 1.2s;
}

.envelope.open::before {
    transform: rotateX(180deg);
}

.envelope.open .letter {
    transform: translateY(-100px);
}

.small-button {
    margin-top: 28px;
    padding: 11px 20px;
    border: none;
    border-radius: 25px;
    background: var(--pink);
    color: white;
    font-family: inherit;
    font-size: 14px;
}

/* TRANG 5 */
.cloud {
    font-size: 42px;
    animation: cloudMove 4s infinite ease-in-out;
}

@keyframes cloudMove {
    0%,100% { transform: translateX(-12px); }
    50% { transform: translateX(12px); }
}

.wish-box {
    background: #f9edf0;
    border-radius: 18px;
    padding: 7%;
    width: 100%;
}

/* TRANG 6 */
.final-heart {
    font-size: 58px;
    animation: heartbeat 1.5s infinite;
}

@keyframes heartbeat {
    0%,100% { transform: scale(1); }
    50% { transform: scale(1.2); }
}

.floating-letter {
    animation: rise 4s ease-in-out infinite;
}

@keyframes rise {
    0%,100% { transform: translateY(0); }
    50% { transform: translateY(-20px); }
}

/* ĐIỀU HƯỚNG */
.controls {
    position: absolute;
    bottom: 4%;
    left: 0;
    width: 100%;
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 12px;
    z-index: 5;
}

.nav-button {
    padding: 10px 17px;
    border: none;
    border-radius: 25px;
    background: #bd718c;
    color: white;
    font-family: inherit;
    font-size: 14px;
}

.nav-button:disabled {
    opacity: .35;
}

#counter {
    font-size: 13px;
    color: #9d6178;
}

#musicButton {
    position: absolute;
    top: 3%;
    right: 4%;
    z-index: 10;
    padding: 9px 13px;
    border: none;
    border-radius: 25px;
    background: #bd718c;
    color: white;
    font-size: 12px;
}

.end-buttons {
    display: flex;
    justify-content: center;
    gap: 10px;
    flex-wrap: wrap;
    margin-top: 7%;
}

.end-buttons button {
    padding: 10px 15px;
    border: none;
    border-radius: 22px;
    background: #bd718c;
    color: white;
    font-family: inherit;
    font-size: 13px;
}

/* ĐIỆN THOẠI THẤP */
@media (max-height: 650px) {
    .paper {
        padding-top: 6%;
        padding-bottom: 6%;
    }

    .page h2 {
        margin-bottom: 3%;
    }

    .page p {
        line-height: 1.6;
        margin: 2% 0;
    }

    .card {
        padding: 3% 2%;
    }

    .controls {
        bottom: 2%;
    }
}
</style>
</head>

<body>

<!-- BÌA SÁCH -->
<div class="screen" id="coverScreen">
    <div class="scene">
        <span class="decor d1">♡</span>
        <span class="decor d2">✧</span>
        <span class="decor d3">✿</span>
        <span class="decor d4">♡</span>

        <div class="cover">
            <div class="cover-flower">🌷</div>

            <h1>Cảm ơn vì đã bấm vào link này nha Như</h1>

            <p>
                Có một vài điều mình muốn gửi đến bạn.
                Hãy dành một chút thời gian để đọc nhé Như.
            </p>

            <button class="main-button" onclick="openBook()">
                📖 Mở sách
            </button>

            <p style="font-size:12px;color:#b77b8b">
                Một cuốn sách nhỏ, một vài lời chân thành từ mik
            </p>
        </div>
    </div>
</div>

<!-- CUỐN SÁCH -->
<div class="screen" id="bookScreen">

    <div class="book">
        <div class="paper" id="paper">
            <div class="page" id="pageContent"></div>
        </div>
    </div>

    <button id="musicButton" onclick="toggleMusic()">
        🎵 Bật nhạc
    </button>

    <div class="controls">
        <button class="nav-button" id="prevButton" onclick="changePage(-1)">
            ❮ Trước
        </button>

        <span id="counter">1 / 6</span>

        <button class="nav-button" id="nextButton" onclick="changePage(1)">
            Tiếp ❯
        </button>
    </div>

</div>



<script>

/* ==================================
   NỘI DUNG 6 TRANG
   Bạn có thể sửa các câu chữ bên dưới
================================== */

const pages = [

/* TRANG 1 */
`
<div class="page-content">
    <div class="big-flower">🌸</div>
    <h2>Một chút tâm sự...</h2>
    <div class="welcome-box">
        <p class="type-text" data-text="Mình không biết nên bắt đầu từ đâu.

Chỉ là có vài điều mình đã muốn nói từ lâu.

Và hôm nay, mình muốn dành những trang sách nhỏ này để gửi đến bạn."></p>
    </div>
</div>
`,

/* TRANG 2 */
`
<div class="page-content">
    <h2>Những điều mình mình muốn nói</h2>

    <div class="cards">

        <div class="card">
            <div class="emoji">🌷</div>
            <h3>Lời thú thật</h3>
            <p class="type-text" data-text="Có những khoảnh khắc tuy bình thường nhưng vẫn đáng nhớ với mình vì bạn đã cùng tui đi đc 2 năm rồi."></p>
        </div>

        <div class="card">
            <div class="emoji">💌</div>
            <h3>Những điều chưa nói</h3>
            <p class="type-text" data-text="Có những suy nghĩ mình chưa biết cách diễn đạt thành lời nhưng khi nhìn vào mắt bạn,một lại cảm thấy nghẹm lòng với cảm xúc mình."></p>
        </div>

        <div class="card">
            <div class="emoji">🕊️</div>
            <h3>Một chút suy nghĩ</h3>
            <p class="type-text" data-text="Mình đã dành thời gian nhìn lại mọi chuyện và cảm thấy bản thân mình có vẻ nóng giận quá mà làm mấy trò ngu ấy."></p>
        </div>

    </div>
</div>
`,

/* TRANG 3 */
`
<div class="page-content">
    <div class="big-flower">☁️</div>
    <h2>Điều mình suy nghĩ</h2>

    <div class="thought-box">
        <p class="type-text" data-text="Mình đã suy nghĩ khá nhiều về những chuyện đã xảy ra.

Có lẽ đôi khi mình chưa thật sự hiểu được cảm xúc của người khác.

Mình cũng nhận ra rằng lời nói và hành động của bản thân có vẻ đi quá xa,ngay cả bản thân mình là người giữ cảm xúc nhưng kh ngờ lại nói lời khó nghe lúc đó"></p>
    </div>
</div>
`,

/* TRANG 4 */
`
<div class="page-content">
    <h2>Mình muốn nói lời xin lỗi</h2>

    <p>
        Có một lá thư nhỏ mình muốn gửi đến bạn.
    </p>

    <div class="envelope-area">
        <div class="envelope" id="envelope">
            <div class="letter">
                <span id="letterText">Một lời xin lỗi chân thành...</span>
            </div>
        </div>

        <button class="small-button" onclick="openEnvelope()">
            💌 Mở lá thư
        </button>
    </div>

    <p style="font-size:12px;color:#b88d99">
        Hãy mở phong bì nhé
    </p>
</div>
`,

/* TRANG 5 */
`
<div class="page-content">
    <div class="cloud">☁️</div>
    <h2>Mong rằng...</h2>

    <div class="wish-box">
        <p class="type-text" data-text="Mình mong rằng những điều tốt đẹp vẫn sẽ đến với bạn.

Mong bạn luôn có thật nhiều niềm vui, bình yên và những ngày thật đáng nhớ.

Dù thế nào, mình vẫn trân trọng những điều tốt đẹp đã từng có.
kh biết bạn có chấp nhận lời xin lỗi này của mình kh nhưng mình hi vọng bạn hãy bỏ qua nhé,Như"></p>
    </div>

    <div class="big-flower">🌼</div>
</div>
`,

/* TRANG 6 */
`
<div class="page-content">
    <div class="final-heart floating-letter">💌</div>

    <h2>Cảm ơn bạn đã đọc</h2>

    <div class="final-message">
        <p class="type-text" data-text="Cảm ơn bạn đã dành thời gian đọc hết cuốn sách nhỏ này.

Mình không mong mọi thứ phải thay đổi ngay lập tức.

Chỉ hy vọng bạn hiểu được những điều mình muốn gửi gắm.

Chúc bạn luôn vui vẻ và bình an với cuộc sống của mình."></p>
    </div>

    <div class="end-buttons">
        <button onclick="restartBook()">↻ Đọc lại</button>
        <button onclick="closeBook()">Đóng sách</button>
    </div>
</div>
`

];


/* ==================================
   BIẾN ĐIỀU KHIỂN
================================== */

let currentPage = 0;
let isAnimating = false;
let typingTimer = null;

const coverScreen = document.getElementById("coverScreen");
const bookScreen = document.getElementById("bookScreen");
const paper = document.getElementById("paper");
const pageContent = document.getElementById("pageContent");
const counter = document.getElementById("counter");
const prevButton = document.getElementById("prevButton");
const nextButton = document.getElementById("nextButton");

const music = document.getElementById("backgroundMusic");
const musicButton = document.getElementById("musicButton");


/* ==================================
   HIỆU ỨNG CHỮ VIẾT DẦN
================================== */

function startTyping() {

    clearInterval(typingTimer);

    const elements = [...document.querySelectorAll(".type-text")];

    let elementIndex = 0;

    function typeElement() {

        if (elementIndex >= elements.length) return;

        const element = elements[elementIndex];
        const fullText = element.dataset.text || "";

        element.textContent = "";

        let charIndex = 0;

        typingTimer = setInterval(() => {

            element.textContent += fullText.charAt(charIndex);
            charIndex++;

            if (charIndex >= fullText.length) {
                clearInterval(typingTimer);
                elementIndex++;
                typeElement();
            }

        }, 28);
    }

    typeElement();
}


/* ==================================
   HIỂN THỊ TRANG
================================== */

function renderPage() {

    clearInterval(typingTimer);

    pageContent.innerHTML = pages[currentPage];

    counter.textContent = (currentPage + 1) + " / " + pages.length;

    prevButton.disabled = currentPage === 0;
    nextButton.disabled = currentPage === pages.length - 1;

    startTyping();
}


/* ==================================
   MỞ SÁCH
================================== */

function openBook() {

    coverScreen.style.display = "none";
    bookScreen.style.display = "block";

    currentPage = 0;

    renderPage();

    // Tự động phát nhạc sau thao tác bấm mở sách
    startMusic();
}


/* ==================================
   CHUYỂN TRANG
================================== */

function changePage(direction) {

    if (isAnimating) return;

    const newPage = currentPage + direction;

    if (newPage < 0 || newPage >= pages.length) return;

    isAnimating = true;

    clearInterval(typingTimer);

    paper.classList.remove("flip-next", "flip-prev");

    // Khởi động lại hiệu ứng lật trang
    void paper.offsetWidth;

    paper.classList.add(
        direction === 1 ? "flip-next" : "flip-prev"
    );

    setTimeout(() => {

        currentPage = newPage;

        paper.classList.remove("flip-next", "flip-prev");

        renderPage();

        isAnimating = false;

    }, 650);
}


/* ==================================
   PHONG BÌ XIN LỖI
================================== */

let envelopeOpened = false;

function openEnvelope() {

    const envelope = document.getElementById("envelope");

    if (!envelope || envelopeOpened) return;

    envelopeOpened = true;

    envelope.classList.add("open");

    const letterText = document.getElementById("letterText");

    letterText.textContent = "bạn Dũng này cũng muốn xin lỗi bạn bằng cả trái tim này thôi";

}


/* ==================================
   NHẠC NỀN
================================== */

function startMusic() {

    music.volume = 0.35;

    music.play().then(() => {

        musicButton.textContent = "🎵 Tắt nhạc";

    }).catch(() => {

        musicButton.textContent = "🎵 Bật nhạc";

    });
}


function toggleMusic() {

    if (music.paused) {

        startMusic();

    } else {

        music.pause();

        musicButton.textContent = "🎵 Bật nhạc";

    }
}


/* ==================================
   ĐỌC LẠI
================================== */

function restartBook() {

    currentPage = 0;
    envelopeOpened = false;

    renderPage();

}


/* ==================================
   ĐÓNG SÁCH
================================== */

function closeBook() {

    clearInterval(typingTimer);

    bookScreen.style.display = "none";
    coverScreen.style.display = "block";

    // Không tự ý dừng nhạc khi đóng sách

}

</script>

</body>
</html>
